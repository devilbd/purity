<div class="date-time-picker-container">
    <button
        class="picker-toggle"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="{{isOpen() ? 'true' : 'false'}}"
        onclick="togglePicker(event)"
    >
        <span class="picker-toggle-icon">📅</span>
        <span class="picker-toggle-text">{{displayLabel}}</span>
    </button>

    <div
        class="picker-overlay {{isOpen() ? 'is-open' : 'is-closed'}} {{enableBlur() ? 'blur-enabled' : ''}} {{placement()}} {{alignPlacement()}}"
        role="dialog"
        aria-label="Date and time picker"
    >
        <div class="calendar-header">
            <div class="label-group">
                <button
                    class="year-toggle-btn"
                    type="button"
                    aria-label="Toggle year picker"
                    onclick="toggleYearPicker()"
                >
                    <span class="month-label">{{monthYearLabel}}</span>
                    <svg class="chevron-icon {{viewMode() === 'year' ? 'is-rotated' : ''}}" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>
            <div class="header-nav">
                <button
                    type="button"
                    class="nav-btn prev-btn"
                    aria-label="Previous month"
                    onclick="prevMonth()"
                >
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button
                    type="button"
                    class="nav-btn next-btn"
                    aria-label="Next month"
                    onclick="nextMonth()"
                >
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>

        <div class="picker-content-wrapper">
            <div class="calendar-body {{viewMode() === 'year' ? 'blurred' : ''}}">
                <div class="calendar-grid" onclick="onCalendarGridClick(event)">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>

                    <button
                        for="let day of calendarDays"
                        class="{{day.cellClass}}"
                        type="button"
                        data-time="{{day.time}}"
                    >
                        {{day.dateNum}}
                    </button>
                </div>
            </div>

            <div class="year-selector-overlay {{viewMode() === 'year' ? 'is-visible' : 'is-hidden'}}">
                <div class="year-grid" onclick="onYearGridClick(event)">
                    <button
                        for="let yr of years"
                        class="year-cell {{yr === viewYear ? 'selected' : ''}}"
                        type="button"
                        data-year="{{yr}}"
                    >
                        {{yr}}
                    </button>
                </div>
            </div>
        </div>

        <div class="time-picker">
            <div class="time-label">
                <span class="time-icon">🕒</span>
                <span>Time:</span>
            </div>
            <div class="time-inner-container">
                <div class="time-input-group">
                    <input
                        type="text"
                        inputmode="numeric"
                        pattern="\d*"
                        maxlength="2"
                        value="{{workingHoursFormatted}}"
                        oninput="onHoursInput(this)"
                        onchange="onTimeChange()"
                        onkeydown="handleTimeKeydown(event, 'hours')"
                        onwheel="handleWheel(event, 'hours')"
                        aria-label="Hours"
                        title="Scroll middle mouse or use Up/Down arrows to change hours (00-23)"
                    />
                    <span class="separator">:</span>
                    <input
                        type="text"
                        inputmode="numeric"
                        pattern="\d*"
                        maxlength="2"
                        value="{{workingMinutesFormatted}}"
                        oninput="onMinutesInput(this)"
                        onchange="onTimeChange()"
                        onkeydown="handleTimeKeydown(event, 'minutes')"
                        onwheel="handleWheel(event, 'minutes')"
                        aria-label="Minutes"
                        title="Scroll middle mouse or use Up/Down arrows to change minutes (00-59)"
                    />
                </div>
            </div>
        </div>

        <div class="picker-footer">
            <button
                class="confirm-button"
                type="button"
                onclick="confirmSelection()"
            >
                OK
            </button>
        </div>
    </div>
</div>
