<div class="analogue-clock-widget">
    <!-- Header Bar -->
    <div class="clock-header">
        <div class="clock-title-group">
            <span class="clock-icon">⏱️</span>
            <span class="clock-title">{{title()}}</span>
            <span class="clock-badge">{{smoothSeconds() ? 'Smooth' : 'Quartz'}}</span>
        </div>
        <div class="clock-tz-badge" title="Active Timezone">
            <span class="tz-icon">🌐</span>
            <span class="tz-text">{{timezoneLabel()}}</span>
        </div>
    </div>

    <!-- Clock Canvas Stage -->
    <div class="clock-stage">
        <canvas
            id="clock-canvas-el"
            class="clock-canvas"
            title="Click to toggle Smooth / Quartz ticking"
            onclick="toggleSweep()"
        ></canvas>
    </div>

    <!-- Digital Readout Display -->
    <div class="clock-digital-readout">
        <span class="digital-time">{{digitalTime()}}</span>
        <span class="digital-date">{{dateString()}}</span>
    </div>

    <!-- Interactive Controls Bar -->
    <div class="clock-controls">
        <button
            type="button"
            class="button-secondary clock-control-btn {{smoothSeconds() ? 'is-active' : ''}}"
            onclick="toggleSweep()"
            title="Toggle between continuous smooth sweep and precision quartz step"
        >
            <span>{{smoothSeconds() ? '⚡ Smooth Sweep' : '⏱ Precision Tick'}}</span>
        </button>

        <button
            type="button"
            class="button-secondary clock-control-btn {{showSeconds() ? 'is-active' : ''}}"
            onclick="toggleSeconds()"
            title="Toggle second hand visibility"
        >
            <span>{{showSeconds() ? '🔴 Seconds Hand' : '⚪ Hide Seconds'}}</span>
        </button>

        <button
            type="button"
            class="button-secondary clock-control-btn {{showNumbers() ? 'is-active' : ''}}"
            onclick="toggleNumbers()"
            title="Toggle dial numerals"
        >
            <span>{{showNumbers() ? '🔢 12/3/6/9 Numerals' : '➖ Minimal Indices'}}</span>
        </button>

        <button
            type="button"
            class="button-secondary clock-control-btn {{showDateBadge() ? 'is-active' : ''}}"
            onclick="toggleDateBadge()"
            title="Toggle dial date aperture window"
        >
            <span>{{showDateBadge() ? '📅 Date Aperture' : '🔲 Clean Dial'}}</span>
        </button>

        <dropdown label="{{timezoneLabel()}}" class="tz-dropdown">
            <ul>
                <li onclick="onTimezoneChange('local')" class="{{timezone() === 'local' ? 'is-selected' : ''}}">
                    <span class="item-icon">📍</span>
                    <span class="item-text">Local Time</span>
                </li>
                <li onclick="onTimezoneChange('UTC')" class="{{timezone() === 'UTC' ? 'is-selected' : ''}}">
                    <span class="item-icon">🌐</span>
                    <span class="item-text">UTC / GMT</span>
                </li>
                <li onclick="onTimezoneChange('America/New_York')" class="{{timezone() === 'America/New_York' ? 'is-selected' : ''}}">
                    <span class="item-icon">🗽</span>
                    <span class="item-text">New York (EST/EDT)</span>
                </li>
                <li onclick="onTimezoneChange('Europe/London')" class="{{timezone() === 'Europe/London' ? 'is-selected' : ''}}">
                    <span class="item-icon">🇬🇧</span>
                    <span class="item-text">London (GMT/BST)</span>
                </li>
                <li onclick="onTimezoneChange('Europe/Paris')" class="{{timezone() === 'Europe/Paris' ? 'is-selected' : ''}}">
                    <span class="item-icon">🇫🇷</span>
                    <span class="item-text">Paris (CET/CEST)</span>
                </li>
                <li onclick="onTimezoneChange('Asia/Tokyo')" class="{{timezone() === 'Asia/Tokyo' ? 'is-selected' : ''}}">
                    <span class="item-icon">🇯🇵</span>
                    <span class="item-text">Tokyo (JST)</span>
                </li>
                <li onclick="onTimezoneChange('Australia/Sydney')" class="{{timezone() === 'Australia/Sydney' ? 'is-selected' : ''}}">
                    <span class="item-icon">🇦🇺</span>
                    <span class="item-text">Sydney (AEST/AEDT)</span>
                </li>
            </ul>
        </dropdown>
    </div>
</div>
