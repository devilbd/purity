<div class="window demo-container">
    <h3>Live Framework Demo</h3>
    <div class="flex-vertical">
        <div id="result" class="{{loginStatus}}">{{loggedUser() ?? 'Not signed in.'}}</div>
        <input id="username" type="text" class="input-primary" value="{{loggedUser()}}" />
        <input
            type="text"
            class="input-primary user-input"
            oninput="demo.onTextInput(this)"
        />
    </div>
    <div class="flex-horizontal">
        <button
            class="button-primary login-btn"
            onclick="demo.onLogin(this)"
        >
            Login
        </button>
        <button
            class="button-cancel logout-btn"
            onclick="demo.onLogout(this)"
        >
            Logout
        </button>
        <button
            class="button-primary default-login-btn"
            onclick="demo.setDefaultLogin(this)"
        >
            Set explicitly value on login input
        </button>
        <button
            class="button-primary modal-open-btn"
            onclick="demo.onOpenModal(this)"
        >
            🪟 Open Modal Dialog
        </button>
    </div>

    <div id="customComponentCustomProperty">{{customComponent1?.customProperty()}}</div>

    <custom-component id="component1" name="customComponent1"></custom-component>

    <div id="droppable-container">
        Drop here
    </div>

    <custom-component id="component2" name="customComponent2"></custom-component>

    <raw-template id="raw-template"></raw-template>

    <forms-validation id="forms-validation"></forms-validation>

    <directive-sample></directive-sample>

    <pipe-sample id="pipe-sample"></pipe-sample>

    <for-sample id="for-sample"></for-sample>

    <date-time-picker-sample id="date-time-picker-sample"></date-time-picker-sample>
    
    <radial-context-menu-sample id="radial-context-menu-sample"></radial-context-menu-sample>

    <http-sample id="http-sample"></http-sample>

    <modal-view id="demo-modal">
        <div class="custom-modal-body">
            <h4>📦 Custom Projected Modal Content</h4>
            <p>This template and child components were passed directly into the <code>&lt;modal-view&gt;</code> body via <code>&lt;slot&gt;</code> content projection!</p>
            <custom-component id="modal-custom-component" name="modalCustom"></custom-component>
        </div>
    </modal-view>

    <loader-component id="app-loader"></loader-component>
</div>
