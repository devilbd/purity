<div class="forms-validation-root window">
    <h3>Forms Validation</h3>
    <form class="forms-validation-form flex-vertical">
        <div class="form-group">
            <label for="input1">First Input (min 3 characters):</label>
            <input id="input1" name="input1" type="text" class="input-primary" placeholder="Type at least 3 characters..." />
        </div>
        <div class="form-group">
            <label for="input2">Second Input (min 5 characters):</label>
            <input id="input2" name="input2" type="text" class="input-primary" placeholder="Type at least 5 characters..." />
        </div>
        <button type="submit" class="button-primary form-submit-btn" disabled>
            Submit Form
        </button>
    </form>
</div>
