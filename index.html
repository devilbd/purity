            <div style="padding: 2rem; font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 0 auto; color: #242424; background: #fdfdfd;">
                <h1>Purity Framework</h1>
                <p><strong>A lightweight, native TypeScript frontend framework powered by fine-grained signals, native Web Components, Dependency Injection, HTTP interceptors, and GNOME Adwaita design system.</strong></p>
                <h2>Key Architectural Features</h2>
                <ul>
                    <li><strong>Fine-Grained Reactivity:</strong> Synchronous signals (<code>signal</code>), computed derivations (<code>computed</code>), and effects (<code>effect</code>) with automatic dependency tracking.</li>
                    <li><strong>Native Web Components:</strong> Plain classes transformed into Custom Elements v1 with synchronous compile-time template inlining.</li>
                    <li><strong>Dependency Injection:</strong> First-class DI container with <code>@Injectable</code> and <code>inject()</code> resolution.</li>
                    <li><strong>HTTP Client &amp; Interceptors:</strong> Type-safe HTTP service with centralized request/response interceptors.</li>
                    <li><strong>Transform Pipes:</strong> Handlebars template transformations with static and reactive dynamic parameters.</li>
                    <li><strong>Decoupled Form Validation:</strong> Declarative form and field validators with CSS state class management.</li>
                    <li><strong>Virtualized Repeater:</strong> High-performance GPU-accelerated rendering for datasets up to 100,000+ items.</li>
                    <li><strong>GNOME 50 Adwaita Design System:</strong> Glassmorphic surfaces, specular borders, and KDE Plasma Breeze vector cursors.</li>
                </ul>
                <p>For complete source code and interactive documentation, visit the <a href="https://github.com/devilbd/purity">GitHub Repository</a>.</p>
            </div>
